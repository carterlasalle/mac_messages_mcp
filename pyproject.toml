[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-messages-mcp"
# Canonical version. A change to this file or manifest.json starts trusted publish.
version = "1.1.0"
description = "A bridge for interacting with macOS Messages app through MCP"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Carter Lasalle", email = "carterlasalle@gmail.com"}
]
keywords = ["macos", "messages", "imessage", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0", # For FastMCP functionality with CLI support
    "thefuzz>=0.20.0",
    "phonenumbers>=8.13.0", # E.164 normalization against the Mac's configured region
    "python-Levenshtein>=0.23.0", # Optional but recommended for performance
    "pillow>=10.0.0", # Image format handling for tool_get_attachment
    "pillow-heif>=0.13.0", # HEIC support so iPhone photos can be returned inline
]

[project.urls]
"Homepage" = "https://github.com/carterlasalle/mac_messages_mcp"
"Bug Tracker" = "https://github.com/carterlasalle/mac_messages_mcp/issues"
"Source" = "https://github.com/carterlasalle/mac_messages_mcp"
"Changelog" = "https://github.com/carterlasalle/mac_messages_mcp/blob/main/CHANGELOG.md"
"Releases" = "https://github.com/carterlasalle/mac_messages_mcp/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
]

# Define both entry points to ensure it works with either name
[project.scripts]
mac-messages-mcp = "mac_messages_mcp.server:run_server"
mac_messages_mcp = "mac_messages_mcp.server:run_server"

[tool.setuptools]
packages = ["mac_messages_mcp"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.basedpyright]
# Point the type checker at the project venv so third-party imports resolve.
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[dependency-groups]
dev = [
    "ast-grep-cli>=0.45.3",
    "bandit>=1.9.4",
    "basedpyright>=1.40.2",
    "blockbuster>=1.5,<1.6",
    "check-jsonschema>=0.27.1",
    "check-manifest>=0.51",
    "complexipy>=8.0.1",
    "coverage>=7.16.2",
    "crosshair-tool>=0.0.111",
    "deal[all]>=4.24.6",
    "deptry>=0.25.1",
    "freezegun>=1.5.5",
    "griffe>=2.3.0",
    "import-linter>=2.15",
    "lizard>=1.24.1",
    "mypy>=1.15.0",
    "nox>=2026.8.17",
    "py-spy>=0.4.2",
    "pyanalyze>=0.13.1",
    "pydoclint>=0.11.0",
    "pylint>=4.1.2",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-memray>=1.11.0",
    "radon>=6.0.1",
    "refurb>=2.3.1",
    "ruff>=0.16.10",
    "schemathesis>=3.14.2",
    "semgrep>=1.85.0",
    "time-machine>=3.5.1",
    "twine>=7.0.0",
    "ty>=0.0.84",
    "validate-pyproject[all]>=0.26",
    "vcrpy>=8.3.0",
    "vulture>=2.16",
    "xdoctest>=1.3.2",
]

# BEGIN BUGHUNT MANAGED MUTMUT CONFIG
[tool.mutmut]
source_paths = ["mac_messages_mcp/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Coverage gaps are reported separately as BHCOV001/BHCOV002. Restrict mutation
# to covered lines by default so mutation testing measures assertion strength
# instead of spending most of its budget on code the suite never executes.
mutate_only_covered_lines = true
# END BUGHUNT MANAGED MUTMUT CONFIG
