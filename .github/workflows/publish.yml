name: Publish Python Package

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - pyproject.toml
      - manifest.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mac-messages-mcp
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.25"
          enable-cache: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(uv version --short)"
          TAG="v${VERSION}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release versions must be stable X.Y.Z values, got ${VERSION}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${TAG}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Synchronize release lockfile
        if: github.ref_type != 'tag'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(release): sync uv.lock for ${TAG}"
            git push origin HEAD:main
          fi

      - name: Capture immutable release commit
        id: release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install release dependencies
        run: uv sync --frozen --extra dev --python 3.13

      - name: Verify version metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --frozen --extra dev python scripts/bump_version.py --check --expected "${VERSION}"

      - name: Test
        run: uv run --frozen --extra dev pytest

      - name: Black formatting
        run: uv run --frozen --extra dev black --check .

      - name: Import ordering
        run: uv run --frozen --extra dev isort --check-only .

      - name: Typing smoke check
        run: uv run --frozen --extra dev mypy --follow-imports=skip --disable-error-code no-any-return mac_messages_mcp/server.py

      - name: Build distributions
        run: uv build

      - name: Verify wheel installation and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv --python 3.13 /tmp/mac-messages-release
          uv pip install --python /tmp/mac-messages-release/bin/python dist/*.whl
          INSTALLED_VERSION="$(/tmp/mac-messages-release/bin/python -c 'from importlib.metadata import version; print(version("mac-messages-mcp"))')"
          test "${INSTALLED_VERSION}" = "${VERSION}"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.25"
          enable-cache: true

      - name: Verify immutable release metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run --no-project python scripts/bump_version.py --check --expected "${VERSION}"

      - name: Build immutable distributions with UV
        run: uv build

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
          verify-metadata: true
          print-hash: true
          verbose: true
          attestations: true

      - name: Verify PyPI filenames and SHA-256 digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/mac-messages-mcp/{version}/json"
          payload = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code != 404 or attempt == 11:
                      raise
              time.sleep(5)
          if payload is None:
              raise SystemExit(f"PyPI did not expose mac-messages-mcp {version}")

          remote = {
              item["filename"]: item["digests"]["sha256"]
              for item in payload.get("urls", [])
          }
          local_files = sorted(Path("dist").iterdir())
          if not local_files:
              raise SystemExit("No local distributions were built")
          for path in local_files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if path.name not in remote:
                  raise SystemExit(f"PyPI is missing {path.name}")
              if remote[path.name] != digest:
                  raise SystemExit(f"PyPI digest mismatch for {path.name}")
              print(f"verified {path.name}: {digest}")
          PY

      - name: Extract release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY' > release-notes.md
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?\n(?P<body>.*?)(?=^## \[|\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match:
              print(match.group("body").strip())
          else:
              print(f"Mac Messages MCP {version}")
          PY

      - name: Create annotated tag at the verified release commit
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            test "${TAG_SHA}" = "${RELEASE_SHA}"
          else
            git tag -a "${TAG}" "${RELEASE_SHA}" -m "Mac Messages MCP ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Mac Messages MCP ${TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              --verify-tag \
              --title "Mac Messages MCP ${TAG}" \
              --notes-file release-notes.md
          fi
